# ============================================================
# RuoYi-Vue 编排：mysql + redis + backend + frontend(nginx)
# ============================================================

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.42}
    container_name: ruoyi-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ry-vue}
    # 不对外暴露端口，仅内部组网访问
    volumes:
      - mysql_data:/var/lib/mysql
      # 初始化脚本（首次启动自动导入 ry-vue 库）
      - ./sql:/docker-entrypoint-initdb.d:ro
      # 客户端字符集配置，避免导入 UTF-8 中文数据被 latin1 误解释
      - ./mysql/conf.d/charset.cnf:/etc/mysql/conf.d/charset.cnf:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ruoyi-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi123}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ruoyi123}", "--appendonly", "yes"]
    # 不对外暴露端口，仅内部组网访问
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        RUOYI_REPO: ${RUOYI_REPO:?请在 .env 中设置 RUOYI_REPO}
        RUOYI_BRANCH: ${RUOYI_BRANCH:?请在 .env 中设置 RUOYI_BRANCH}
    image: ruoyi/ruoyi-server:${IMAGE_TAG:-3.9.2}
    container_name: ruoyi-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      # 数据源 / Redis 指向 docker 网络内的服务名（RuoYi-Vue 使用 druid 主库数据源）
      SPRING_DATASOURCE_DRUID_MASTER_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ry-vue}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi123}
    # 不对外暴露端口，仅内部组网访问
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 前端构建产物交给 nginx 托管，并反向代理 /prod-api 到后端
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        RUOYI_UI_REPO: ${RUOYI_UI_REPO:?请在 .env 中设置 RUOYI_UI_REPO}
        RUOYI_UI_BRANCH: ${RUOYI_UI_BRANCH:?请在 .env 中设置 RUOYI_UI_BRANCH}
    image: ruoyi/ruoyi-nginx:${IMAGE_TAG:-3.9.2}
    container_name: ruoyi-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
