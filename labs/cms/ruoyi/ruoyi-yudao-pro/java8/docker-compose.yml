# ============================================================
# ruoyi-vue-pro（java8）编排
#   mysql + redis + backend(SpringBoot2.7/JDK8/SpringSecurity, 内部48080) + frontend(nginx 托管并反代后端)
#   对外仅暴露前端 nginx（WEB_PORT），后端/数据库/redis 仅内部组网
#   后端配置经 compose 环境变量覆盖（dynamic-datasource + redis），无 config/ 挂载
# ============================================================

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.42}
    container_name: yudao8-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
    volumes:
      - mysql_data_yudao8:/var/lib/mysql
      - ./sql/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: yudao8-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      # build context 指向 ruoyi 根目录，以便复用 common/maven-settings.xml
      context: ../..
      dockerfile: ruoyi-yudao-pro/java8/backend/Dockerfile
      args:
        YUDAO_REPO: ${YUDAO_REPO:-https://github.com/YunaiV/ruoyi-vue-pro.git}
        YUDAO_BRANCH: ${YUDAO_BRANCH:-master}
    image: ruoyi/yudao8-server:${IMAGE_TAG:-master}
    container_name: yudao8-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 激活 local profile（端口 48080 定义于 application-local.yaml）
      SPRING_PROFILES_ACTIVE: local
      # dynamic-datasource 主库指向内部 mysql 服务名
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ruoyi-vue-pro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true"
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # SpringBoot2.7：spring.redis.host
      SPRING_REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_REPO: ${FRONTEND_REPO:-https://github.com/yudaocode/yudao-ui-admin-vue3.git}
        FRONTEND_BRANCH: ${FRONTEND_BRANCH:-master}
    image: ruoyi/yudao8-ui:${IMAGE_TAG:-master}
    container_name: yudao8-ui
    restart: unless-stopped
    volumes:
      # 反向代理配置：静态资源 + /admin-api 转发到 backend（保留前缀）
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8084}:80"
    depends_on:
      - backend

volumes:
  mysql_data_yudao8:
