version: '3.8'

services:
  mysql:
    image: mysql:5.7
    container_name: seacms-mysql
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: seacms_db
      MYSQL_USER: seacms
      MYSQL_PASSWORD: seacms123
    networks:
      - lab-net

  web:
    build: ./php
    container_name: seacms-web
    restart: "no"
    ports:
      - "8080:80"
    networks:
      - lab-net
    depends_on:
      - mysql

networks:
  lab-net: