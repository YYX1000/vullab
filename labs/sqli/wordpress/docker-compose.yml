services:
  php-fpm:
    build:
      context: ./wordpress7.0.1
      dockerfile: Dockerfile
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    restart: always

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: vuln_wp
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass123
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
  wp_data: