name: Vullab CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate compose matrix
        id: gen
        run: |
          matrix=$(find ./labs -name "docker-compose.yml" -type f | while IFS= read -r path; do
            dir=$(dirname "${path}")
            lab_name=$(basename "${dir}")
            vuln_type=$(basename "$(dirname "${dir}")")
            jq -n -c \
              --arg dir "${dir}" \
              --arg lab "${lab_name}" \
              --arg vuln_type "${vuln_type}" \
              '{dir: $dir, lab: $lab, vuln_type: $vuln_type}'
          done | jq -s -c '.')
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  lab-validate:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose v2
        run: |
          sudo apt update
          sudo apt install -y docker-compose-v2

      - name: Validate & Build Lab
        run: |
          set -e
          echo "=================================================="
          echo "VulnType: [${{ matrix.vuln_type }}] Lab: ${{ matrix.lab }}"
          echo "Dir: ${{ matrix.dir }}"
          echo "=================================================="

          cd "${{ matrix.dir }}"

          docker compose config
          docker compose build

          docker compose up -d --build
          sleep 12
          docker compose ps
          docker compose logs --tail=50
          docker compose down --remove-orphans --volumes
